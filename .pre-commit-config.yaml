repos:

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.10.0
  hooks:
    - id: black
      args:
        - --line-length=120
        - --include='(pyqtribbon/.*\.py|tests/.*\.py|docs/source/conf\.py)'

- repo: https://github.com/pycqa/isort
  rev: 9.0.2
  hooks:
    - id: isort
      args:
        - --profile=black

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: "v23.1.2"
  hooks:
    - id: clang-format
      types_or:
        - c
        - c++
